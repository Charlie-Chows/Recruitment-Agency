<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Stackly Recruitment Agency</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

    <div class="auth-page">
        <!-- Back to Home -->
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>

        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo" aria-label="Stackly Homepage">
                    <img src="assets/logo_trimmed.webp" alt="Stackly Logo">
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Please enter your credentials to sign in.</p>
            </div>

            <form class="auth-form" id="loginForm">
                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Custom Role Dropdown -->
                <div class="form-group">
                    <label>Account Role</label>
                    <div class="custom-select-wrapper" id="roleSelectWrapper">
                        <div class="form-control custom-select" id="customSelect">
                            <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="left: 14px;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span class="custom-select-trigger" id="roleDisplay">Select your role</span>
                            <div class="custom-arrow"></div>
                        </div>
                        <div class="custom-options">
                            <div class="custom-option" data-value="user">User Dashboard</div>
                            <div class="custom-option" data-value="admin">Admin Portal</div>
                        </div>
                    </div>
                    <input type="hidden" id="roleValue" required>
                    <div id="roleError" style="color: #ef4444; font-size: 12px; margin-top: 2px; display: none;">Please select a role.</div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-pass">
                    <a href="404.html">Forgot password?</a>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <div class="divider">Or continue with</div>

            <div class="social-logins">
                <a href="404.html" class="social-btn">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
                    Google
                </a>
                <a href="404.html" class="social-btn">
                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" alt="LinkedIn">
                    LinkedIn
                </a>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create account</a>
            </div>
        </div>
    </div>

    <script>
        // Custom Dropdown Toggle
        const wrapper = document.getElementById('roleSelectWrapper');
        const customSelect = document.getElementById('customSelect');
        const roleDisplay = document.getElementById('roleDisplay');
        const roleValueInput = document.getElementById('roleValue');
        const options = document.querySelectorAll('.custom-option');
        const roleError = document.getElementById('roleError');

        customSelect.addEventListener('click', (e) => {
            e.stopPropagation();
            wrapper.classList.toggle('open');
        });

        options.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                options.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                
                roleDisplay.textContent = option.textContent;
                roleValueInput.value = option.getAttribute('data-value');
                roleError.style.display = 'none';
                wrapper.classList.remove('open');
            });
        });

        document.addEventListener('click', () => {
            wrapper.classList.remove('open');
        });

        // Form Submit Redirect
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const role = roleValueInput.value;
            
            if (!role) {
                roleError.style.display = 'block';
                return;
            }

            let username = email.split('@')[0];
            username = username.charAt(0).toUpperCase() + username.slice(1);
            
            localStorage.setItem('stackly_username', username);
            localStorage.setItem('stackly_role', role);

            if (role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'user.html';
            }
        });
    </script>
</body>

</html>
