<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Stackly Recruitment Agency</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

    <div class="auth-page">
        <!-- Back to Home -->
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>

        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo" aria-label="Stackly Homepage">
                    <img src="assets/logo_trimmed.webp" alt="Stackly Logo">
                </a>
                <h1 class="auth-title">Create an account</h1>
                <p class="auth-subtitle">Join Stackly and find top talent or jobs.</p>
            </div>

            <form class="auth-form" id="signupForm">
                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" class="form-control" placeholder="Create password" required minlength="6">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
                    </div>
                    <div id="passwordError" style="color: #ef4444; font-size: 12px; margin-top: 2px; display: none;">Passwords do not match.</div>
                </div>

                <!-- Custom Role Dropdown -->
                <div class="form-group">
                    <label>Account Role</label>
                    <div class="custom-select-wrapper" id="roleSelectWrapper">
                        <div class="form-control custom-select" id="customSelect">
                            <svg class="input-mono-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="left: 14px;">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span class="custom-select-trigger" id="roleDisplay">Select your role</span>
                            <div class="custom-arrow"></div>
                        </div>
                        <div class="custom-options">
                            <div class="custom-option" data-value="user">User Dashboard</div>
                            <div class="custom-option" data-value="admin">Admin Portal</div>
                        </div>
                    </div>
                    <input type="hidden" id="roleValue" required>
                    <div id="roleError" style="color: #ef4444; font-size: 12px; margin-top: 2px; display: none;">Please select a role.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn" style="margin-top: 0.25rem;">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // Custom Dropdown Toggle
        const wrapper = document.getElementById('roleSelectWrapper');
        const customSelect = document.getElementById('customSelect');
        const roleDisplay = document.getElementById('roleDisplay');
        const roleValueInput = document.getElementById('roleValue');
        const options = document.querySelectorAll('.custom-option');
        const roleError = document.getElementById('roleError');

        customSelect.addEventListener('click', (e) => {
            e.stopPropagation();
            wrapper.classList.toggle('open');
        });

        options.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                options.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                
                roleDisplay.textContent = option.textContent;
                roleValueInput.value = option.getAttribute('data-value');
                roleError.style.display = 'none';
                wrapper.classList.remove('open');
            });
        });

        document.addEventListener('click', () => {
            wrapper.classList.remove('open');
        });

        // Form Submit
        const signupForm = document.getElementById('signupForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const role = roleValueInput.value;
            
            let hasError = false;

            if (password !== confirmPassword) {
                passwordError.style.display = 'block';
                hasError = true;
            } else {
                passwordError.style.display = 'none';
            }

            if (!role) {
                roleError.style.display = 'block';
                hasError = true;
            }

            if (hasError) return;

            window.location.href = 'login.html';
        });

        confirmPasswordInput.addEventListener('input', () => {
            passwordError.style.display = 'none';
        });
    </script>
</body>

</html>
